name: "@get-enlace/nest"

on:
  push:
    branches: [main]
    paths:
      - packages/enlace-nest/**
      - package.json
      - package-lock.json
      - .github/workflows/enlace-nest.yml
  # Fired by enlace-ui's own release workflow after it publishes (dev or
  # prod) — release-strategy.md §5/§6. This package pins an *exact*
  # @get-enlace/ui version for its prod publishes (packages/enlace-nest/
  # ui-version.txt), so it needs to react to every production release, not
  # just majors — see handle-ui-release below. No workflow_dispatch escape
  # hatch — a manual override is just a commit pushed to main.
  repository_dispatch:
    types: [enlace-ui-release]

jobs:
  # Only meaningful for a *production* dispatch — a dev dispatch's
  # ui-version carries a "-dev.<run>" prerelease suffix, which is never a
  # valid pin target. Does exactly one thing: pins the incoming version
  # into ui-version.txt and commits it. Not a dependency of deploy-dev (no
  # `needs:` from there to here) — deploy-dev doesn't use this pin at all
  # (see below), and this commit's push can't retrigger the workflow
  # anyway (GITHUB_TOKEN pushes don't, by GitHub's own loop-prevention
  # rule).
  handle-ui-release:
    if: github.event_name == 'repository_dispatch' && github.event.client_payload.environment == 'production'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update pinned @get-enlace/ui version
        id: pin
        run: |
          new_version="${{ github.event.client_payload.ui-version }}"
          current_version="$(cat packages/enlace-nest/ui-version.txt 2>/dev/null || true)"
          if [ "$new_version" = "$current_version" ]; then
            echo "ui-version.txt already pinned to ${new_version} — nothing to do"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "$new_version" > packages/enlace-nest/ui-version.txt
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Retries with a rebase on a rejected push: this job and
      # enlace-express.yml's handle-ui-release both fire from the same
      # repository_dispatch and can race to push main concurrently — even
      # though they touch different files (per-package ui-version.txt,
      # chosen specifically to avoid a same-file conflict), they still both
      # advance the same branch pointer, so one can lose a non-fast-forward
      # race regardless. Confirmed happening on a real dispatch. The two
      # commits touch disjoint files, so a rebase here is conflict-free.
      - name: Commit pinned version
        if: steps.pin.outputs.changed == 'true'
        run: |
          git add packages/enlace-nest/ui-version.txt
          git commit -m "chore(enlace-nest): pin @get-enlace/ui to ${{ github.event.client_payload.ui-version }} (enlace-ui-release dispatch)"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push rejected (attempt $i), rebasing onto latest main and retrying..."
            git fetch origin main
            git rebase origin/main
          done
          echo "::error::failed to push pin commit after 5 attempts"
          exit 1

  # Unconditional — runs on every trigger (push, or repository_dispatch for
  # either environment). Its own npm ci resolves @get-enlace/ui via the
  # committed "dev" dist-tag (see package.json) — completely decoupled
  # from ui-version.txt, which deploy-prod alone reads, transiently, right
  # before publishing. That's what keeps this job's install always
  # resolvable: "dev" is the only thing that reliably exists in the
  # registry it installs from.
  deploy-dev:
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # Full history + tags — "Check for changes" below diffs against
          # this package's most recent enlace-nest-v* tag (dev or prod) to
          # decide whether there's anything new to publish.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@get-enlace'

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm run typecheck --workspace @get-enlace/nest
      - run: npm run build --workspace @get-enlace/nest

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check for changes since last publish
        id: diff
        run: |
          last_tag="$(git tag -l "enlace-nest-v*" --sort=-creatordate | head -n1)"
          if [ -n "$last_tag" ] && git diff --quiet "$last_tag" -- packages/enlace-nest; then
            echo "packages/enlace-nest: unchanged since ${last_tag}"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set the dev version
        id: version
        if: steps.diff.outputs.changed == 'true'
        run: |
          # run_id, not run_number: run_number resets to 1 per workflow
          # file, which previously collided with @get-enlace/express's
          # existing dev.1-dev.4 versions (published by enlace-ui's old CI
          # under that same repo-local counter, before the package moved
          # here). run_id is unique across every run on GitHub, forever.
          dev_version="$(node -p "require('./packages/enlace-nest/package.json').version")-dev.${{ github.run_id }}"
          npm pkg set version="$dev_version" --workspace @get-enlace/nest
          echo "devVersion=$dev_version" >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub Packages (dev)
        if: steps.diff.outputs.changed == 'true'
        run: npm publish --workspace @get-enlace/nest --tag dev
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git tag "enlace-nest-v${{ steps.version.outputs.devVersion }}"
          git push origin "enlace-nest-v${{ steps.version.outputs.devVersion }}"

  # Requires deploy-dev to have succeeded first — prod never ships anything
  # that hasn't just gone out (or already sat unchanged) as a dev build.
  # Also gated behind the Prod environment's required-reviewer approval:
  # this job pauses here until someone approves it.
  deploy-prod:
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          # ref: main — must see handle-ui-release's pin commit from this
          # same run (production dispatch case), not the stale
          # pre-dispatch SHA.
          ref: main
          fetch-depth: 0

      # Hard guard, not just documentation: fail fast, before any build
      # work, if there's nothing real to pin. ui-version.txt starts life
      # as "unreleased" and only ever becomes real once enlace-ui's own
      # first prod release fires a dispatch that pins it — publishing with
      # anything else in there would ship a broken dependency (not valid
      # semver at all) to every real consumer.
      - name: Refuse to publish without a real pinned @get-enlace/ui version
        run: |
          pinned="$(cat packages/enlace-nest/ui-version.txt 2>/dev/null || true)"
          if [[ ! "$pinned" =~ ^[0-9] ]]; then
            echo "::error::packages/enlace-nest/ui-version.txt is '${pinned:-<empty>}', not a real version — enlace-ui needs a real prod release first, which pins this file via handle-ui-release, before a prod release here is valid."
            exit 1
          fi
          echo "pinned_version=$pinned" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@get-enlace'

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm run typecheck --workspace @get-enlace/nest
      - run: npm run build --workspace @get-enlace/nest

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Whatever's already committed in package.json is what gets
      # published — semver bump type (patch/minor/major) is a human call,
      # decided by editing package.json before this runs, not guessed by
      # CI.
      - name: Read current version
        id: current
        run: echo "version=$(node -p "require('./packages/enlace-nest/package.json').version")" >> "$GITHUB_OUTPUT"

      # A second setup-node call, switching the active registry from
      # GitHub Packages to npmjs.org for the rest of this job — the
      # documented way to publish to a different registry mid-job without
      # disturbing the GitHub Packages auth the earlier steps relied on.
      - name: Point npm at npmjs.org
        uses: actions/setup-node@v4
        with:
          registry-url: 'https://registry.npmjs.org'

      # Transient — pins the exact @get-enlace/ui version into
      # package.json just for this publish, so the published tarball is
      # fully deterministic. Reverted right after, so the committed repo
      # state keeps the "dev" placeholder every npm ci elsewhere relies on
      # (never gets swept up into the version-bump commit below).
      - name: Pin @get-enlace/ui to the exact version for this publish
        run: npm pkg set "dependencies.@get-enlace/ui=${{ env.pinned_version }}" --workspace @get-enlace/nest

      # Root cause confirmed on enlace-ui's real prod-publish attempts (took
      # two wrong guesses first — see its main.yml for the full story): the
      # FIRST setup-node call above (before npm ci) passes both
      # registry-url AND scope: '@get-enlace', which writes a SCOPED
      # registry mapping (@get-enlace:registry=https://npm.pkg.github.com)
      # into the generated .npmrc — a more specific config key than the
      # general `registry=` default the second setup-node call sets, and
      # also more specific than this repo's own committed .npmrc. npm
      # always prefers a scope-specific registry over the general default
      # for a scoped package, so neither publishConfig.registry nor a bare
      # --registry flag ever actually touched the real blocker. Overriding
      # that exact scoped key directly is what works — CLI flags are the
      # one thing with higher precedence than any .npmrc tier (including
      # the committed one).
      - name: Publish to npm (prod)
        # --access public: scoped packages (@get-enlace/...) default to
        # restricted access on npmjs.org, which needs a paid org plan
        # unless publish explicitly opts into public access.
        run: >
          npm publish --workspace @get-enlace/nest
          --registry https://registry.npmjs.org
          --@get-enlace:registry=https://registry.npmjs.org
          --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Revert the transient dependency pin
        run: git checkout -- packages/enlace-nest/package.json

      - name: Tag the release
        run: git tag "enlace-nest-v${{ steps.current.outputs.version }}"

      # Stages the next release as a patch bump on top of what was just
      # published. Edit packages/enlace-nest/package.json by hand before
      # the next prod release if it actually needs a bigger (minor/major)
      # bump.
      - name: Compute next patch version
        id: next
        run: |
          next_version="$(node -e "
            const [major, minor, patch] = '${{ steps.current.outputs.version }}'.split('.').map(Number);
            console.log([major, minor, patch + 1].join('.'));
          ")"
          echo "version=$next_version" >> "$GITHUB_OUTPUT"

      - name: Bump to next version
        run: |
          npm pkg set version="${{ steps.next.outputs.version }}" --workspace @get-enlace/nest
          git add packages/enlace-nest/package.json

      - name: Commit version bump
        run: |
          git commit -m "chore(enlace-nest): bump to ${{ steps.next.outputs.version }} after v${{ steps.current.outputs.version }} release"

      - name: Push commit and tag
        run: git push origin HEAD:main "enlace-nest-v${{ steps.current.outputs.version }}"
