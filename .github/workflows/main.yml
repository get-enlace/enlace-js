name: Build, Publish (dev), Tag

on:
  # Manual-only for now, matching get-enlace/enlace-ui's own dev-publish
  # workflow before it went live on every push — flip to push: branches:
  # [main] once a manual run has been confirmed working end to end.
  workflow_dispatch: {}

permissions:
  contents: write # push the git tag
  packages: write # publish to GitHub Packages, and read @get-enlace/ui from it

jobs:
  build-publish-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@get-enlace'

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run typecheck
      - run: npm run build

      # Only @get-enlace/express exists today — this step publishes it
      # directly rather than looping over packages/*, since a loop would be
      # speculative complexity for a single package. Extend this (see
      # get-enlace/enlace-ui's own main.yml for the per-workspace pattern
      # used there once it had two packages) once a second adapter
      # (@get-enlace/nest, etc.) actually lands here.
      - name: Compute dev build version
        id: version
        run: echo "dev_version=$(node -p "require('./packages/enlace-express/package.json').version")-dev.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Bump to the dev version
        run: npm pkg set version=${{ steps.version.outputs.dev_version }} --workspace @get-enlace/express

      - name: Publish to GitHub Packages (dev dist-tag)
        run: npm publish --workspace @get-enlace/express --tag dev
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag this build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.version.outputs.dev_version }}"
          git push origin "v${{ steps.version.outputs.dev_version }}"
