name: Build, Publish (dev), Tag

on:
  # Manual-only for now, matching get-enlace/enlace-ui's own dev-publish
  # workflow before it went live on every push — flip to push: branches:
  # [main] once a manual run has been confirmed working end to end.
  workflow_dispatch: {}

permissions:
  contents: write # push the git tag
  packages: write # publish to GitHub Packages, and read @get-enlace/ui from it

jobs:
  build-publish-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@get-enlace'

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run typecheck
      - run: npm run build

      # Loops over every package under packages/* rather than a matrix job,
      # so the shared npm ci/typecheck/build steps above run once for the
      # whole workspace instead of once per package. Each package gets its
      # own dev version (independent of the others) and its own git tag,
      # prefixed with the package directory so tags never collide.
      - name: Publish each package (dev dist-tag) and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for dir in enlace-express enlace-nest; do
            pkg="$(node -p "require('./packages/${dir}/package.json').name")"
            dev_version="$(node -p "require('./packages/${dir}/package.json').version")-dev.${{ github.run_number }}"
            npm pkg set version="$dev_version" --workspace "$pkg"
            npm publish --workspace "$pkg" --tag dev
            git tag "${dir}-v${dev_version}"
            git push origin "${dir}-v${dev_version}"
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
