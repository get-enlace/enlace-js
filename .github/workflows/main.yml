name: Build, Publish (dev), Tag

on:
  push:
    branches: [main]
  # Manual fallback — e.g. to retry a publish without pushing an empty commit.
  workflow_dispatch: {}

permissions:
  contents: write # push the git tag
  packages: write # publish to GitHub Packages, and read @get-enlace/ui from it

jobs:
  build-publish-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags, not just the latest commit — each
          # package's most recent <dir>-v* tag is the "since last publish"
          # marker the publish step diffs against below.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@get-enlace'

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run typecheck
      - run: npm run build

      # Loops over every package under packages/* rather than a matrix job,
      # so the shared npm ci/typecheck/build steps above run once for the
      # whole workspace instead of once per package. Each package is
      # published independently — its own dev version, its own git tag
      # (prefixed with the package directory so tags never collide) — and,
      # crucially, only if it actually changed: a package's most recent
      # <dir>-v* tag marks its last publish, and if nothing under
      # packages/<dir>/ differs from that tag, it's skipped rather than
      # republished unchanged. No tag yet (first-ever publish) always
      # counts as changed.
      - name: Publish changed packages (dev dist-tag) and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for dir in enlace-express enlace-nest; do
            last_tag="$(git tag -l "${dir}-v*" --sort=-creatordate | head -n1)"
            if [ -n "$last_tag" ] && git diff --quiet "$last_tag" -- "packages/${dir}"; then
              echo "packages/${dir}: unchanged since ${last_tag}, skipping"
              continue
            fi
            pkg="$(node -p "require('./packages/${dir}/package.json').name")"
            # run_id, not run_number: run_number resets to 1 per workflow
            # file, which collided head-on with @get-enlace/express's
            # existing dev.1-dev.4 versions (published by enlace-ui's old
            # CI, under this same repo-local counter, before the package
            # moved here). run_id is unique across every run on GitHub,
            # forever, so this can't recur.
            dev_version="$(node -p "require('./packages/${dir}/package.json').version")-dev.${{ github.run_id }}"
            npm pkg set version="$dev_version" --workspace "$pkg"
            npm publish --workspace "$pkg" --tag dev
            git tag "${dir}-v${dev_version}"
            git push origin "${dir}-v${dev_version}"
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
